<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas - Academia Espacial</title>
    <link rel="stylesheet" href="style.css">
    <script src="flores.js" defer></script>
</head>

<body>

<header>
    <div class="contenedor">
        <h1 class="titulo">🧮 Calculadora de Notas</h1>
    </div>
</header>

<main class="conten-principal conten-centrado">

    <div class="conten-parrafo">

        <h1 class="p-nombre">Promedio ponderado</h1>

        <p class="parrafo">
            Agrega tus notas con su porcentaje de peso y calcula tu promedio
            ponderado (escala de 0 a 5).
        </p>

        <div class="panel">

            <label for="nota">Nota (0 a 5):</label>
            <input type="number" id="nota" min="0" max="5" step="0.1" placeholder="Ej: 4.5">

            <label for="peso">Porcentaje (%):</label>
            <input type="number" id="peso" min="1" max="100" step="1" placeholder="Ej: 30">

            <div class="botones_1">
                <button class="boton_1" id="btn-agregar">➕ Agregar nota</button>
            </div>

        </div>

        <ul class="lista" id="lista-notas"></ul>

        <div class="botones_1">
            <button class="boton_1" id="btn-calcular">📊 Calcular promedio</button>
            <button class="boton_2" id="btn-reiniciar">🔄 Reiniciar</button>
        </div>

        <p class="mensaje" id="resultado"></p>

        <div class="botones_1">
            <button class="boton_1" onclick="window.location.href='menu.html'">
                🛸 Volver al menú
            </button>
        </div>

    </div>

</main>

<script src="calculadora.js"></script>
</body>
</html>
