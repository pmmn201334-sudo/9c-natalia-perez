<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Academia Espacial</title>
    <link rel="stylesheet" href="style.css">
    <script src="flores.js" defer></script>
</head>

<body>

<header>
    <div class="contenedor">
        <h1 class="titulo">🚀 Registro de Cadete Espacial</h1>
    </div>
</header>

<main class="conten-principal conten-centrado">

    <div class="conten-parrafo">

        <h1 class="p-nombre">👩‍🚀 Crear cuenta de astronauta</h1>

        <p class="parrafo">
            Regístrate en la Academia Espacial para iniciar tus misiones,
            guardar tus tareas, escribir tu diario y participar en desafíos.
        </p>

        <form id="form-registro">

            <label for="nombre">Nombre del cadete:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>

            <label for="password">Código secreto:</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>

            <div class="botones_1">
                <button class="boton_1" type="submit">🚀 Registrarme</button>
            </div>

        </form>

        <div class="botones_1">
            <button class="boton_1" onclick="window.location.href='index.html'">
                🌎 Volver al inicio
            </button>
        </div>

    </div>

</main>

<script src="registro.js"></script>
</body>
</html>
