<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la Galaxia - Academia Espacial</title>
    <link rel="stylesheet" href="style.css">
    <script src="flores.js" defer></script>
</head>

<body>

<header>
    <div class="contenedor">
        <h1 class="titulo">🎮 Juego de la Galaxia</h1>
    </div>
</header>

<main class="conten-principal conten-centrado">

    <div class="conten-parrafo">

        <h1 class="p-nombre">Enciende el jardín</h1>

        <p class="parrafo">
            Tu jardín espacial está oscuro. Encuentra las parejas de flores
            y estrellas para encender la luz. ¡Completa las 6 parejas para que
            todo vuelva a brillar!
        </p>

        <div class="juego-tablero" id="tablero"></div>

        <p class="mensaje" id="mensaje"></p>

        <div class="botones_1">
            <button class="boton_1" id="btn-reiniciar">🔄 Reintentar</button>
            <a href="menu.html">
                <button class="boton_1">🛸 Volver al menú</button>
            </a>
        </div>

    </div>

</main>

<script src="juego.js"></script>
</body>
</html>
